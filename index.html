<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#0a67d8">
  <link rel="manifest" href="manifest.json">
  <title>操作工快速指导</title>
  <style>
    :root {
      --bg: #f3f7fc;
      --panel: rgba(255,255,255,.98);
      --ink: #142742;
      --muted: #6d7d91;
      --blue: #0a67d8;
      --blue2: #0fa7ff;
      --cyan: #16d7ff;
      --green: #10ae76;
      --purple: #7251d8;
      --line: #e3edf8;
      --danger: #e6383a;
      --warn: #f39800;
      --ok: #0aa36f;
      --shadow: 0 10px 28px rgba(16, 54, 96, .12);
      --soft-shadow: 0 4px 14px rgba(16, 54, 96, .08);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #edf5ff 0%, var(--bg) 38%, #f7fbff 100%);
      font-size: 17px;
      line-height: 1.55;
    }
    body:before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 0%, rgba(15,167,255,.12), transparent 26%),
        linear-gradient(rgba(10,103,216,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(10,103,216,.045) 1px, transparent 1px);
      background-size: auto, 28px 28px, 28px 28px;
      mask-image: linear-gradient(to bottom, black, transparent 82%);
    }
    .app { width: min(980px, 100%); margin: 0 auto; padding: 0 12px 86px; }
    .hero {
      position: relative;
      overflow: hidden;
      margin: 0 -12px;
      min-height: 176px;
      padding: 14px 26px 42px;
      color: #fff;
      background:
        linear-gradient(90deg, rgba(4,42,91,.96), rgba(3,72,142,.82) 46%, rgba(7,23,42,.70)),
        radial-gradient(circle at 88% 78%, rgba(255,158,29,.95) 0 3px, rgba(255,180,62,.55) 4px 16px, transparent 17px),
        linear-gradient(135deg, #073b83 0%, #0b67d8 54%, #10233b 100%);
    }
    .hero:before {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0;
      width: 48%;
      height: 74%;
      opacity: .34;
      background:
        radial-gradient(circle at 70% 72%, rgba(255,171,46,.92) 0 4px, rgba(255,196,88,.42) 5px 22px, transparent 23px),
        linear-gradient(135deg, transparent 0 44%, rgba(255,255,255,.28) 45% 46%, transparent 47%),
        linear-gradient(25deg, transparent 0 54%, rgba(255,147,38,.42) 55% 56%, transparent 57%);
    }
    .hero:after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, transparent, rgba(255,255,255,.16), transparent),
        repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 1px, transparent 1px 9px);
      transform: translateX(-100%);
      animation: scan 4.8s linear infinite;
    }
    @keyframes scan { to { transform: translateX(100%); } }
    .statusbar { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; font-size: 14px; color: rgba(255,255,255,.92); }
    .hero h1 { position: relative; z-index: 1; margin: 0; max-width: 100%; font-size: 30px; letter-spacing: 0; line-height: 1.18; text-shadow: 0 3px 12px rgba(0,0,0,.26); }
    .subtitle { position: relative; z-index: 1; margin: 9px 0 0; max-width: 100%; color: rgba(255,255,255,.9); font-size: 16px; font-weight: 700; }
    .brand { position: relative; z-index: 2; display: inline-flex; margin-top: 12px; padding: 4px 9px; border: 1px solid rgba(255,255,255,.34); border-radius: 999px; font-size: 12px; letter-spacing: 1px; background: rgba(255,255,255,.12); backdrop-filter: blur(8px); }
    .install-btn { display: none; position: relative; z-index: 2; min-height: 44px; margin: 12px 0 0 10px; padding: 0 13px; border: 1px solid rgba(255,255,255,.44); border-radius: 9px; color: #fff; background: rgba(255,255,255,.16); font-size: 14px; }
    .nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin: -28px 4px 14px; position: sticky; top: 6px; z-index: 8; padding: 8px 8px 0; background: rgba(255,255,255,.97); border: 1px solid rgba(218,230,245,.92); border-radius: 12px; box-shadow: var(--shadow); backdrop-filter: blur(10px); }
    button, .button { min-height: 44px; border: 0; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; }
    .nav button { position: relative; min-height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #17253a; background: transparent; border-radius: 10px 10px 0 0; box-shadow: none; font-size: 15px; }
    .nav button:before { content: attr(data-icon); display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; color: #fff; font-size: 23px; line-height: 1; background: var(--blue); box-shadow: 0 7px 16px rgba(10,103,216,.22); }
    .nav button:nth-child(2):before { background: var(--green); }
    .nav button:nth-child(3):before { background: var(--danger); }
    .nav button:nth-child(4):before { background: var(--purple); }
    .nav button.active { color: #075fc2; background: transparent; }
    .nav button.active:after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 0; height: 4px; border-radius: 99px 99px 0 0; background: linear-gradient(90deg, var(--blue), var(--blue2)); }
    .section { display: none; }
    .section.active { display: block; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      margin: 12px 4px;
      box-shadow: var(--shadow);
    }
    .card h2, .card h3 { margin: 0 0 8px; line-height: 1.25; }
    .section-title { display: flex; align-items: center; justify-content: space-between; margin: 18px 8px 8px; }
    .section-title h2 { margin: 0; font-size: 22px; color: #075fc2; }
    .section-title a { color: #4d6f94; font-size: 14px; font-weight: 700; text-decoration: none; }
    .search-row { display: grid; grid-template-columns: 1fr 86px; gap: 8px; margin-top: 12px; }
    input[type="search"] { width: 100%; min-height: 52px; border-radius: 12px; border: 1px solid #dce8f6; padding: 0 14px 0 42px; font-size: 16px; background: #fff; box-shadow: inset 0 1px 4px rgba(20,39,66,.05); }
    .search-wrap { position: relative; }
    .search-wrap:before { content: "⌕"; position: absolute; left: 14px; top: 50%; transform: translateY(-54%); color: #7c8da2; font-size: 28px; z-index: 1; }
    .primary { color: #fff; background: linear-gradient(135deg, #0b6edc, #0aa6ff); box-shadow: 0 8px 16px rgba(10,103,216,.22); }
    .ghost { color: #0d4e91; background: #eef7ff; border: 1px solid #b8d8f8; }
    .hotline { display: flex; align-items: center; gap: 8px; margin: 12px 0 2px; color: var(--muted); font-size: 14px; }
    .chips { display: flex; flex-wrap: nowrap; gap: 6px; overflow-x: auto; padding: 2px 0 4px; }
    .chip { min-height: 30px; padding: 0 10px; border-radius: 7px; border: 1px solid #d8e6f5; color: #596a80; background: #f7faff; font-size: 13px; font-weight: 700; white-space: nowrap; }
    .grid { display: grid; gap: 10px; }
    .entry { text-align: left; width: 100%; background: #fff; border: 1px solid var(--line); padding: 14px; border-radius: 12px; min-height: 64px; color: var(--ink); box-shadow: var(--soft-shadow); }
    .entry strong { display: block; font-size: 18px; }
    .entry span { color: var(--muted); font-size: 14px; }
    .maint-card { min-height: 174px; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 12px 8px; overflow: hidden; }
    .maint-card strong { width: 100%; min-height: 42px; display: flex; align-items: center; justify-content: center; font-size: 15px; line-height: 1.25; }
    .maint-card > span:not(.icon) { width: 100%; min-height: 38px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.35; }
    .maint-card .icon { width: 54px; height: 54px; flex: 0 0 54px; display: grid; place-items: center; margin: 0 0 8px; border-radius: 14px; font-size: 30px; color: #0b67d8; background: linear-gradient(180deg, #edf7ff, #fff); border: 1px solid #dcebf8; box-shadow: inset 0 -8px 22px rgba(10,103,216,.06); }
    .maint-card:nth-child(2) .icon { color: var(--green); }
    .maint-card:nth-child(3) .icon { color: var(--warn); }
    .maint-card:nth-child(4) .icon { color: var(--purple); }
    .maint-card .mini-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 34px; margin-top: auto; padding: 0 12px; border-radius: 7px; background: #edf6ff; color: #0b67d8; font-size: 14px; font-style: normal; }
    .risk { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 13px; font-weight: 800; }
    .risk.high { color: #fff; background: var(--danger); }
    .risk.medium { color: #fff; background: var(--warn); }
    .risk.low { color: #fff; background: var(--ok); }
    .warning { position: relative; overflow: hidden; padding-right: 92px; border-color: #ffe1dc; background: linear-gradient(105deg, #fff5f3 0%, #fff 60%, #fff2f0 100%); }
    .warning h3 { color: var(--danger); }
    details { background: #fff; border: 1px solid var(--line); border-radius: 12px; margin: 10px 4px; overflow: hidden; box-shadow: 0 6px 18px rgba(8,48,92,.08); }
    summary { min-height: 54px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; font-weight: 800; cursor: pointer; }
    details .body { border-top: 1px solid var(--line); padding: 12px 14px 14px; }
    .kv { margin: 12px 0; }
    .kv b { display: block; color: #0a4f93; margin-bottom: 4px; }
    .purpose-highlight { color: #e63838; font-weight: 800; }
    ul, ol { margin: 6px 0 0; padding-left: 22px; }
    li { margin: 4px 0; }
    mark { background: #fff066; color: #111; padding: 0 2px; border-radius: 2px; }
    .media-slot { margin-top: 12px; border: 1px dashed #99c9f5; background: #f4fbff; border-radius: 8px; padding: 10px; color: var(--muted); font-size: 14px; }
    .visual-steps { display: grid; gap: 12px; margin-top: 10px; }
    .visual-step { border: 1px solid #dce8f6; background: #f8fbff; border-radius: 10px; padding: 10px; }
    .visual-step-title { display: block; color: #075fc2; font-weight: 800; margin-bottom: 4px; }
    .visual-step-text { margin: 0 0 8px; color: #3b4d63; font-size: 15px; }
    .visual-step-img { display: block; width: 100%; max-height: 520px; object-fit: contain; border-radius: 8px; border: 1px solid #d2e0ef; background: #fff; cursor: zoom-in; touch-action: manipulation; }
    .pin-img { display: block; width: 100%; max-height: 560px; object-fit: contain; border-radius: 8px; border: 1px solid #d7e7f7; background: #f6fbff; margin-top: 10px; cursor: zoom-in; touch-action: manipulation; }
    body.modal-open { overflow: hidden; }
    .image-modal { position: fixed; inset: 0; z-index: 99; display: none; align-items: center; justify-content: center; padding: 68px 12px 20px; background: rgba(4,18,35,.9); touch-action: none; overflow: hidden; }
    .image-modal.active { display: flex; }
    .image-modal img { max-width: 100%; max-height: 82vh; object-fit: contain; border-radius: 10px; background: #fff; box-shadow: 0 18px 44px rgba(0,0,0,.38); touch-action: none; transform-origin: center center; will-change: transform; }
    .image-modal-close { position: fixed; right: 14px; top: 14px; width: 48px; height: 48px; border-radius: 50%; color: #fff; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.28); font-size: 28px; line-height: 1; }
    .image-modal-tools { position: fixed; left: 14px; top: 14px; display: flex; gap: 8px; z-index: 100; }
    .image-modal-tools button { min-width: 46px; height: 46px; border-radius: 999px; color: #fff; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.28); font-size: 18px; font-weight: 800; }
    .home-fault-list { display: grid; gap: 0; }
    .fault-row { display: grid; grid-template-columns: 36px 1fr 18px; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid #eef2f7; background: transparent; box-shadow: none; border-radius: 0; }
    .fault-row:last-child { border-bottom: 0; }
    .fault-icon { width: 36px; height: 36px; display: grid; place-items: center; color: #fff; border-radius: 10px; font-size: 22px; font-weight: 900; background: var(--danger); }
    .fault-row.medium .fault-icon { background: var(--warn); }
    .fault-title-line { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .fault-flow { display: none; }
    .chev { color: #9aa8b7; font-size: 26px; }
    .quick-panel { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; padding: 12px 4px; }
    .quick-tile { min-height: 74px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-right: 1px solid #e7eef7; color: #26384f; background: transparent; border-radius: 0; font-size: 14px; }
    .quick-tile:last-child { border-right: 0; }
    .quick-tile b { font-size: 26px; line-height: 1; color: var(--blue); }
    .quick-tile:nth-child(2) b { color: var(--green); }
    .quick-tile:nth-child(3) b { color: var(--warn); }
    .quick-tile:nth-child(4) b { color: var(--purple); }
    .quick-tile span { color: var(--muted); font-size: 12px; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 4px; }
    .footer { color: #506984; text-align: center; font-size: 14px; margin: 16px 4px 0; padding: 16px 10px; border-radius: 12px; background: #eaf4ff; border: 1px solid #dcebf8; }
    #topBtn { position: fixed; right: 14px; bottom: 18px; width: 48px; height: 48px; border-radius: 50%; color: #fff; background: #075fc2; box-shadow: var(--shadow); display: none; z-index: 20; }
    .pwa-notice { position: fixed; left: 12px; right: 72px; bottom: 18px; z-index: 35; display: none; align-items: center; gap: 10px; min-height: 48px; padding: 8px 10px 8px 13px; border: 1px solid #b9d9fb; border-radius: 10px; color: #073e76; background: rgba(242,249,255,.98); box-shadow: 0 10px 28px rgba(8,48,92,.2); font-size: 14px; font-weight: 700; }
    .pwa-notice.visible { display: flex; }
    #offlineNotice { bottom: 76px; color: #7a4310; border-color: #ffd297; background: rgba(255,248,235,.98); }
    .pwa-notice span { flex: 1; }
    .pwa-notice button { min-height: 36px; padding: 0 10px; border-radius: 7px; color: #fff; background: #0a67d8; font-size: 13px; white-space: nowrap; }
    @media (min-width: 520px) { .home-maintenance-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 519px) {
      .home-maintenance-grid { grid-template-columns: repeat(2, 1fr); }
      .hero { padding-bottom: 44px; }
      .hero h1 { font-size: 28px; }
      .brand { margin-top: 10px; font-size: 11px; }
      .warning { padding-right: 14px; }
    }
    @media (min-width: 720px) { .grid.two { grid-template-columns: repeat(2, 1fr); } .grid.three { grid-template-columns: repeat(3, 1fr); } .hero { border-radius: 0 0 18px 18px; } }
    @media (prefers-reduced-motion: reduce) { .hero:after { animation: none; } html { scroll-behavior: auto; } }
    /*
      2026 UI/UX 优化：保持原有数据、搜索、详情折叠和 PWA 逻辑不变。
      以下覆盖层仅收敛视觉风格，并为手机端补充固定导航。
    */
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --ink: #142b45;
      --muted: #63758a;
      --blue: #1269ad;
      --blue2: #2c89cf;
      --line: #dce5ef;
      --shadow: 0 2px 8px rgba(20, 43, 69, .07);
      --soft-shadow: 0 1px 3px rgba(20, 43, 69, .06);
    }
    body {
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 16px;
    }
    body:before { display: none; }
    .app { padding: 0 14px calc(92px + env(safe-area-inset-bottom)); }
    .hero {
      min-height: 0;
      margin: 0 -14px;
      padding: calc(12px + env(safe-area-inset-top)) 20px 20px;
      background: linear-gradient(135deg, #0b477d, #1269ad);
    }
    .hero:before, .hero:after { display: none; }
    .statusbar { margin-bottom: 14px; font-size: 13px; }
    .hero h1 { font-size: 23px; text-shadow: none; }
    .subtitle { margin-top: 4px; font-size: 15px; font-weight: 600; }
    .brand { margin-top: 9px; padding: 2px 0; border: 0; border-radius: 0; background: transparent; font-size: 10px; letter-spacing: .8px; opacity: .78; }
    .install-btn { margin: 10px 0 0 8px; }
    .nav { margin: -8px 4px 14px; position: relative; top: auto; padding: 5px 6px 0; border-radius: 10px; box-shadow: var(--shadow); }
    .nav button { min-height: 64px; gap: 3px; font-size: 14px; }
    .nav button:before { width: 30px; height: 30px; border-radius: 8px; font-size: 19px; box-shadow: none; }
    .nav button:nth-child(4):before { background: #307d69; }
    .nav button.active:after { height: 3px; background: var(--blue); }
    .card { margin: 12px 0; padding: 14px; border-radius: 10px; box-shadow: var(--soft-shadow); }
    .section-title { margin: 20px 2px 9px; }
    .section-title h2 { font-size: 20px; color: #134e7d; }
    .section-title a { min-height: 44px; display: inline-flex; align-items: center; padding: 0 6px; color: #38617f; }
    .search-row { grid-template-columns: 1fr 82px; gap: 8px; margin-top: 0; }
    input[type="search"] { min-height: 50px; border-radius: 9px; font-size: 16px; }
    .primary { background: #1269ad; box-shadow: none; }
    .ghost { border-color: #bdd2e6; color: #145789; background: #f5faff; }
    .hotline { margin: 9px 0 0; }
    .chip { min-height: 32px; border-radius: 6px; background: #f7fafc; }
    #home > .warning, #homeMaintenance, #home .quick-panel { display: none; }
    .home-core-actions { display: grid; gap: 10px; margin: 16px 0 6px; }
    .home-primary-action, .home-secondary-action {
      width: 100%; min-height: 74px; display: flex; align-items: center; text-align: left; color: var(--ink);
      border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: #fff; box-shadow: var(--soft-shadow);
    }
    .home-primary-action { min-height: 92px; border-color: #b9d4e8; background: #edf7ff; }
    .home-action-icon { width: 42px; height: 42px; flex: 0 0 42px; display: grid; place-items: center; margin-right: 12px; border-radius: 9px; color: #fff; background: #1269ad; font-size: 24px; font-style: normal; }
    .home-primary-action .home-action-icon { color: #fff; background: #db4b4b; }
    .home-action-copy { display: grid; gap: 2px; min-width: 0; }
    .home-action-copy strong { font-size: 18px; line-height: 1.25; }
    .home-action-copy span { color: var(--muted); font-size: 14px; font-weight: 500; }
    .home-action-chevron { margin-left: auto; color: #6b8298; font-size: 28px; font-weight: 400; }
    .home-secondary-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .home-secondary-action { min-height: 94px; align-items: flex-start; padding: 12px; }
    .home-secondary-action .home-action-icon { width: 34px; height: 34px; flex-basis: 34px; margin-right: 8px; font-size: 19px; background: #277e70; }
    .home-secondary-action.safety .home-action-icon { background: #d78324; }
    .home-secondary-action .home-action-copy strong { font-size: 16px; }
    .home-secondary-action .home-action-copy span { font-size: 12px; line-height: 1.35; }
    .home-secondary-action .home-action-chevron { display: none; }
    .home-common-card { padding: 4px 14px; }
    details { margin: 10px 0; border-radius: 10px; box-shadow: var(--soft-shadow); }
    #faultList details { border-left: 4px solid #d97824; }
    #faultList details:has(.risk.high) { border-left-color: #d94b4b; }
    #faultList details:has(.risk.low) { border-left-color: #277e70; }
    summary { min-height: 60px; padding: 12px; }
    details .body { padding: 12px; }
    .kv { margin: 14px 0; }
    .kv b { color: #154f7d; }
    .warning { padding: 14px; border-left: 4px solid #d94b4b; background: #fff7f6; }
    .visual-steps { gap: 12px; }
    .visual-step { padding: 12px; border-radius: 9px; background: #fbfdff; }
    .visual-step-title { color: #134e7d; font-size: 16px; }
    .visual-step-text { color: #344d64; font-size: 15px; line-height: 1.55; }
    .visual-step-img, .pin-img { max-height: 620px; border-radius: 7px; }
    .image-tap-hint { display: block; margin-top: 7px; color: #55738c; font-size: 12px; text-align: right; }
    .fault-row { min-height: 62px; padding: 12px 0; }
    .fault-icon { width: 34px; height: 34px; border-radius: 8px; box-shadow: none; }
    .fault-title-line strong { font-size: 16px; }
    .footer { margin: 20px 0 0; border-radius: 10px; box-shadow: none; }
    #topBtn { right: 14px; bottom: calc(80px + env(safe-area-inset-bottom)); box-shadow: var(--shadow); }
    .pwa-notice { bottom: calc(80px + env(safe-area-inset-bottom)); right: 70px; box-shadow: var(--shadow); }
    #offlineNotice { bottom: calc(138px + env(safe-area-inset-bottom)); }
    .bottom-nav { display: none; }
    .home-primary-action:active, .home-secondary-action:active, .fault-row:active { transform: scale(.985); }
    @media (max-width: 719px) {
      .nav { display: none; }
      .bottom-nav {
        position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr);

      var footer = document.querySelector('.footer');
      var match = footer && footer.textContent.match(/版本：\s*V(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)/);
      if (!match) { return; }
      try { localStorage.setItem('welding-guide-updates:seen:101', match[1]); }
      catch (_) { /* 禁用存储时不影响手册使用。 */ }
    })();
  </script>
</body>
</html>
